name: Scout
description: Scout (Scout Space) is a Techstars- and venture-backed space technology company founded in
  2019 that builds next-generation orbital sensing and autonomy for Space Domain Awareness (SDA). Its
  in-space products, first launched in 2021, let spacecraft see and understand objects around them
  through electro-optical and infrared sensors (the Owl long-range SDA sensor line), edge processing
  hardware, mission autonomy software developed with the U.S. Space Force, and mission-design analysis.
  Scout supplies cross-orbit intelligence and dynamic space operations to government and commercial
  operators and has been awarded multiple AFWERX SBIR and USSF TACFI contracts. Scout does not publish a
  public developer API, SDK, or developer portal; this profile captures its identity and domain-security
  posture for the API Evangelist network.
